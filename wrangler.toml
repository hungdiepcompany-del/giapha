name = "web-gia-pha"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[secrets]
required = ["BACKUP_SERVICE_INTERNAL_TOKEN"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[[services]]
binding = "BACKUP_SERVICE_PRODUCTION"
service = "web-gia-pha-backup-service-production"
