name: Backup Service Version Upload

# Manual upload-only creation of a zero-traffic production version. Deployment is deliberately absent.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-service-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup-service-production-version-upload:
    name: Backup service zero-traffic version upload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source-only production contract
        run: node scripts/check-m2d-production-backup-preflight.cjs

      - name: Upload secret-bearing production version
        working-directory: services/backup-service
        env:
          BACKUP_SERVICE_INTERNAL_TOKEN: ${{ secrets.BACKUP_SERVICE_INTERNAL_TOKEN }}
          BACKUP_DATA_KEY_V1_B64: ${{ secrets.BACKUP_DATA_KEY_V1_B64 }}
          BACKUP_OBJECT_KEY_HMAC_V1_B64: ${{ secrets.BACKUP_OBJECT_KEY_HMAC_V1_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)
          test -n "${BACKUP_SERVICE_INTERNAL_TOKEN}" || (echo "BACKUP_SERVICE_INTERNAL_TOKEN is missing" && exit 1)
          test -n "${BACKUP_DATA_KEY_V1_B64}" || (echo "BACKUP_DATA_KEY_V1_B64 is missing" && exit 1)
          test -n "${BACKUP_OBJECT_KEY_HMAC_V1_B64}" || (echo "BACKUP_OBJECT_KEY_HMAC_V1_B64 is missing" && exit 1)
          umask 077
          SECRETS_FILE="${RUNNER_TEMP}/backup-service-production-secrets.json"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          export SECRETS_FILE
          node -e 'const fs = require("node:fs"); fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify({ BACKUP_SERVICE_INTERNAL_TOKEN: process.env.BACKUP_SERVICE_INTERNAL_TOKEN, BACKUP_DATA_KEY_V1_B64: process.env.BACKUP_DATA_KEY_V1_B64, BACKUP_OBJECT_KEY_HMAC_V1_B64: process.env.BACKUP_OBJECT_KEY_HMAC_V1_B64 }), { mode: 0o600 });'
          chmod 600 "$SECRETS_FILE"
          npx wrangler versions upload --env production --secrets-file "$SECRETS_FILE"
